<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Hospital Management System</h1>

        <h2>Patient Registration</h2>

        <form id="patientForm">

            <label for="patientName">Patient Name:</label>
            <input type="text" id="patientName" required>

            <label for="patientAge">Age:</label>
            <input type="number" id="patientAge" required>

            <label for="patientGender">Gender:</label>
            <select id="patientGender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label for="patientContact">Contact Number:</label>
            <input type="tel" id="patientContact" required>

            <button type="submit">Register Patient</button>

        </form>

        <p id="registrationMessage"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
<hr>

<h2>Doctor Management</h2>

<form id="doctorForm">

    <label for="doctorName">Doctor Name:</label>
    <input type="text" id="doctorName" required>

    <label for="doctorSpecialization">Specialization:</label>
    <input type="text" id="doctorSpecialization" required>

    <label for="doctorContact">Contact Number:</label>
    <input type="tel" id="doctorContact" required>

    <button type="submit">Add Doctor</button>

</form>

<p id="doctorMessage"></p>
