<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Hospital Management System</h1>

        <h2>Patient Registration</h2>

        <form id="patientForm">

            <label for="patientName">Patient Name:</label>
            <input type="text" id="patientName" required>

            <label for="patientAge">Age:</label>
            <input type="number" id="patientAge" required>

            <label for="patientGender">Gender:</label>
            <select id="patientGender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label for="patientContact">Contact Number:</label>
            <input type="tel" id="patientContact" required>

            <button type="submit">Register Patient</button>

        </form>

        <p id="registrationMessage"></p>
        <h2>Registered Patients</h2>

<table id="patientTable">
    <thead>
        <tr>
            <th>Patient Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Contact Number</th>
        </tr>
    </thead>

    <tbody id="patientTableBody">
    </tbody>
</table>

    </div>

    <script src="script.js"></script>
</body>
</html>
<hr>

<h2>Doctor Management</h2>

<form id="doctorForm">

    <label for="doctorName">Doctor Name:</label>
    <input type="text" id="doctorName" required>

    <label for="doctorSpecialization">Specialization:</label>
    <input type="text" id="doctorSpecialization" required>

    <label for="doctorContact">Contact Number:</label>
    <input type="tel" id="doctorContact" required>

    <button type="submit">Add Doctor</button>

</form>

<p id="doctorMessage"></p>
<hr>

<h2>Appointment Management</h2>

<form id="appointmentForm">

    <label for="appointmentPatient">Patient Name:</label>
    <input type="text" id="appointmentPatient" required>

    <label for="appointmentDoctor">Doctor Name:</label>
    <input type="text" id="appointmentDoctor" required>

    <label for="appointmentDate">Appointment Date:</label>
    <input type="date" id="appointmentDate" required>

    <label for="appointmentTime">Appointment Time:</label>
    <input type="time" id="appointmentTime" required>

    <button type="submit">Add Appointment</button>

</form>

<p id="appointmentMessage"></p>

<h2>Appointment List</h2>

<table id="appointmentTable">
    <thead>
        <tr>
            <th>Patient Name</th>
            <th>Doctor Name</th>
            <th>Date</th>
            <th>Time</th>
        </tr>
    </thead>

    <tbody id="appointmentTableBody">
    </tbody>
</table>
